<div class="flex flex-col items-center justify-center min-h-screen relative bg-gradient-to-r from-gray-700 to-gray-900 overflow-hidden">
  <!-- Fondo animado tipo Nexus -->
  <div class="absolute inset-0 z-0 bg-transparent animate-background">
    <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" class="stroke-current text-indigo-500 opacity-40 animate-pulse"/>
      <circle cx="50" cy="50" r="30" class="stroke-current text-blue-500 opacity-40 animate-pulse animation-delay-200"/>
      <circle cx="50" cy="50" r="20" class="stroke-current text-teal-500 opacity-40 animate-pulse animation-delay-400"/>
    </svg>
  </div>

  <div class="bg-white rounded-lg shadow-xl p-8 max-w-md z-10 text-center opacity-0 animate-fadeIn">
    <h1 class="text-4xl font-bold text-gray-900 mb-4 opacity-0 animate-slideInUp">¡Bienvenido a tu aplicación!</h1>
    <p class="text-gray-700 mb-8 opacity-0 animate-slideInUp animation-delay-300">Gestiona tus tareas y organiza tu día de manera eficiente.</p>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="text-red-600 mb-4">
      {{ errorMessage }}
    </div>

    <!-- Formulario para login y registro -->
    <div class="mb-4">
      <input type="email" [(ngModel)]="email" placeholder="Correo electrónico" class="w-full p-2 mb-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input type="password" [(ngModel)]="password" placeholder="Contraseña" class="w-full p-2 mb-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <div class="flex flex-col space-y-4">
      <!-- Botón para Iniciar sesión -->
      <button (click)="login()" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 transition-all duration-300 ease-in-out opacity-0 animate-slideInUp animation-delay-500 transform hover:scale-105">
        Iniciar sesión
      </button>

      <!-- Botón para Registrar -->
      <button (click)="register()" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-300 transition-all duration-300 ease-in-out opacity-0 animate-slideInUp animation-delay-500 transform hover:scale-105">
        Registrarse
      </button>
    </div>
  </div>
</div>
